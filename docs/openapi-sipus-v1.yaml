openapi: 3.0.3
info:
  title: SIPUS-Del RESTful API
  description: |
    Sistem Informasi Perpustakaan Kampus Del (SIPUS-Del) API v1.
    Menyediakan layanan pengelolaan katalog buku, sirkulasi peminjaman atomik dengan Pessimistic Concurrency Locking, integrasi referensi eksternal OpenLibrary, dan layanan SOAP Library Clearance.
  version: 1.0.0
  contact:
    name: Davina Olivia Yosefanny Hutabarat (12S24047)
    email: pustakawan@del.ac.id
servers:
  - url: http://localhost:8000
    description: Development Server (php artisan serve)
  - url: http://localhost
    description: Local Web Server

tags:
  - name: Authentication
    description: Manajemen sesi dan penerbitan Personal Access Token Sanctum pustakawan
  - name: Books
    description: Katalog buku, pencarian, paginasi bebas N+1, HATEOAS, dan CRUD
  - name: Loans
    description: Sirkulasi peminjaman dan pengembalian atomik dengan penguncian baris DB
  - name: External Reference
    description: Integrasi API konsumer buku OpenLibrary
  - name: SOAP Clearance
    description: Layanan verifikasi bebas pustaka wisuda/yudisium via protokol SOAP XML

paths:
  /soap/sipus.wsdl:
    get:
      tags:
        - SOAP Clearance
      summary: Mendapatkan dokumen WSDL kontrak SOAP SIPUS-Del
      responses:
        '200':
          description: Dokumen WSDL valid
          content:
            application/wsdl+xml:
              schema:
                type: string

  /soap/sipus:
    post:
      tags:
        - SOAP Clearance
      summary: Memproses verifikasi status bebas pustaka mahasiswa via SOAP
      requestBody:
        required: true
        content:
          text/xml:
            schema:
              type: string
            example: |
              <?xml version="1.0" encoding="utf-8"?>
              <soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/" xmlns:sip="http://sipus.del.ac.id/soap">
                  <soap:Body>
                      <sip:CheckClearanceStatusRequest>
                          <sip:nim_peminjam>12S24001</sip:nim_peminjam>
                      </sip:CheckClearanceStatusRequest>
                  </soap:Body>
              </soap:Envelope>
      responses:
        '200':
          description: Status bebas pustaka berhasil diperiksa
          content:
            text/xml:
              schema:
                type: string
        '400':
          description: SOAP Fault akibat XML cacat atau NIM kosong
          content:
            text/xml:
              schema:
                type: string

  /api/v1/auth/login:
    post:
      tags:
        - Authentication
      summary: Login pustakawan dan penerbitan Bearer Token Sanctum
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - device_name
              properties:
                email:
                  type: string
                  format: email
                  example: pustakawan@del.ac.id
                password:
                  type: string
                  format: password
                  example: password123
                device_name:
                  type: string
                  example: postman-client
      responses:
        '200':
          description: Login berhasil, access token diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Otentikasi berhasil.
                  data:
                    type: object
                    properties:
                      token_type:
                        type: string
                        example: Bearer
                      access_token:
                        type: string
                        example: 1|YEGCLVeFgi8IXNX03yKqN8QHgk7PLSlAM1C66mRQa2e05d4b
                      user:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem401'
        '422':
          $ref: '#/components/responses/Problem422'

  /api/v1/auth/me:
    get:
      tags:
        - Authentication
      summary: Mengambil profil pustakawan terautentikasi
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Data profil pengguna berhasil diambil
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Problem401'

  /api/v1/auth/logout:
    post:
      tags:
        - Authentication
      summary: Mencabut (revoke) token aktif sesi saat ini
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Token berhasil dicabut, tidak ada konten respon
        '401':
          $ref: '#/components/responses/Problem401'

  /api/v1/bukus:
    get:
      tags:
        - Books
      summary: Mendapatkan daftar katalog buku (publik, terpaginasi, bebas N+1)
      parameters:
        - name: search
          in: query
          description: Pencarian teks pada judul, penulis, atau ISBN
          required: false
          schema:
            type: string
        - name: kategori_id
          in: query
          description: Filter berdasarkan ID kategori buku
          required: false
          schema:
            type: integer
        - name: tersedia
          in: query
          description: Filter buku dengan stok > 0 jika bernilai 1
          required: false
          schema:
            type: integer
            enum: [0, 1]
        - name: sort
          in: query
          description: Pengurutan kolom whitelist (prefix '-' untuk descending)
          required: false
          schema:
            type: string
            enum: [judul, -judul, penulis, -penulis, stok, -stok, tahun_terbit, -tahun_terbit, created_at, -created_at]
            default: -created_at
        - name: per_page
          in: query
          description: Jumlah item per halaman (maksimum 50)
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
            minimum: 1
      responses:
        '200':
          description: Daftar koleksi buku terpaginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BukuResource'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Books
      summary: Menambahkan data buku baru ke katalog perpustakaan
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '201':
          description: Buku berhasil dibuat
          headers:
            Location:
              description: URI absolut untuk mengakses resource buku yang baru dibuat
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BukuResource'
        '401':
          $ref: '#/components/responses/Problem401'
        '422':
          $ref: '#/components/responses/Problem422'

  /api/v1/bukus/{id}:
    get:
      tags:
        - Books
      summary: Mengambil detail satu buku beserta relasi kategori dan riwayat peminjaman
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail buku ditemukan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BukuDetailResource'
        '404':
          $ref: '#/components/responses/Problem404'

    put:
      tags:
        - Books
      summary: Mengganti seluruh data buku (PUT)
      description: Semua atribut wajib dikirim. Atribut nullable (sinopsis) yang tidak dikirim akan di-reset menjadi NULL.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BukuInput'
      responses:
        '200':
          description: Buku berhasil diperbarui seluruhnya
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BukuResource'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'

    patch:
      tags:
        - Books
      summary: Memperbarui sebagian atribut buku (PATCH)
      description: Minimal satu field harus dikirim. Payload kosong akan ditolak dengan 400 Bad Request.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isbn:
                  type: string
                judul:
                  type: string
                penulis:
                  type: string
                penerbit:
                  type: string
                tahun_terbit:
                  type: integer
                kategori_id:
                  type: integer
                stok:
                  type: integer
                  minimum: 0
                sinopsis:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Atribut buku berhasil diperbarui sebagian
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BukuResource'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'

    delete:
      tags:
        - Books
      summary: Menghapus data buku
      description: Ditolak dengan kode 409 Conflict jika buku masih memiliki transaksi peminjaman aktif ('dipinjam').
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Buku berhasil dihapus (No Content)
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'

  /api/v1/bukus/{id}/referensi-eksternal:
    get:
      tags:
        - External Reference
      summary: Mengambil data referensi bibliografi eksternal dari OpenLibrary API
      description: Memanggil OpenLibrary ISBN API dengan timeout 8 detik dan mitigasi error upstream 502 tanpa membuat aplikasi crash.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Data referensi eksternal berhasil diperoleh
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      buku_id:
                        type: integer
                      isbn:
                        type: string
                      judul:
                        type: string
                      penulis:
                        type: string
                      sumber:
                        type: string
                        example: OpenLibrary
                      referensi:
                        type: object
                      _links:
                        type: object
        '404':
          $ref: '#/components/responses/Problem404'
        '502':
          $ref: '#/components/responses/Problem502'

  /api/v1/peminjamans:
    get:
      tags:
        - Loans
      summary: Mendapatkan daftar transaksi sirkulasi peminjaman buku
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter status sirkulasi
          required: false
          schema:
            type: string
            enum: [dipinjam, dikembalikan]
        - name: nim
          in: query
          description: Filter berdasarkan NIM mahasiswa peminjam
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          description: Jumlah item per halaman (maksimum 50)
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Daftar transaksi peminjaman
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PeminjamanResource'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Problem401'

    post:
      tags:
        - Loans
      summary: Membuat transaksi peminjaman buku baru secara atomik dengan Pessimistic Concurrency Lock
      description: Mengunci baris buku (`lockForUpdate`). Menolak jika stok < 1 (422) atau jika mahasiswa masih meminjam buku yang sama (409).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - buku_id
                - nim_peminjam
                - nama_peminjam
                - durasi_hari
              properties:
                buku_id:
                  type: integer
                  example: 1
                nim_peminjam:
                  type: string
                  example: "12S24001"
                nama_peminjam:
                  type: string
                  example: "Mahasiswa Del"
                durasi_hari:
                  type: integer
                  minimum: 1
                  maximum: 30
                  example: 7
      responses:
        '201':
          description: Peminjaman berhasil dicatat, stok buku didecrement
          headers:
            Location:
              description: URI absolut transaksi peminjaman
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PeminjamanResource'
        '401':
          $ref: '#/components/responses/Problem401'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'

  /api/v1/peminjamans/{id}:
    get:
      tags:
        - Loans
      summary: Mengambil detail satu transaksi peminjaman
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail transaksi peminjaman
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PeminjamanResource'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'

  /api/v1/peminjamans/{id}/kembalikan:
    patch:
      tags:
        - Loans
      summary: Mengembalikan buku pinjaman secara atomik dengan Pessimistic Concurrency Lock
      description: Mengunci baris transaksi dan baris buku. Menolak jika sudah berstatus 'dikembalikan' (409). Memulihkan stok (+1) dan mencatat tanggal pengembalian.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Buku berhasil dikembalikan, stok dipulihkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PeminjamanResource'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Pustakawan Del
        email:
          type: string
          format: email
          example: pustakawan@del.ac.id

    BukuInput:
      type: object
      required:
        - isbn
        - judul
        - penulis
        - penerbit
        - tahun_terbit
        - kategori_id
        - stok
      properties:
        isbn:
          type: string
          example: "978-602-0005"
        judul:
          type: string
          example: "Arsitektur REST API Modern"
        penulis:
          type: string
          example: "Tim Pengembang Del"
        penerbit:
          type: string
          example: "Del Press"
        tahun_terbit:
          type: integer
          example: 2026
        kategori_id:
          type: integer
          example: 1
        stok:
          type: integer
          minimum: 0
          example: 5
        sinopsis:
          type: string
          nullable: true
          example: "Buku panduan perancangan RESTful API."

    BukuResource:
      type: object
      properties:
        id:
          type: integer
          example: 1
        isbn:
          type: string
          example: "978-602-0001"
        judul:
          type: string
          example: "Sistem Terdistribusi Lanjutan"
        penulis:
          type: string
          example: "Staf Pengajar TI"
        penerbit:
          type: string
          example: "Del Press"
        tahun_terbit:
          type: integer
          example: 2024
        stok:
          type: integer
          example: 3
        sinopsis:
          type: string
          nullable: true
        kategori_id:
          type: integer
          example: 1
        kategori:
          type: object
          properties:
            id:
              type: integer
            kode_kategori:
              type: string
            nama_kategori:
              type: string
        total_peminjaman:
          type: integer
          example: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        _links:
          type: object
          properties:
            self:
              type: object
              properties:
                href:
                  type: string
                method:
                  type: string
            kategori:
              type: object
              properties:
                href:
                  type: string
                method:
                  type: string
            referensi_eksternal:
              type: object
              properties:
                href:
                  type: string
                method:
                  type: string
            pinjam_buku:
              type: object
              description: HANYA muncul jika stok > 0
              properties:
                href:
                  type: string
                method:
                  type: string

    BukuDetailResource:
      allOf:
        - $ref: '#/components/schemas/BukuResource'
        - type: object
          properties:
            riwayat_peminjaman:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  kode_pinjam:
                    type: string
                  nim_peminjam:
                    type: string
                  nama_peminjam:
                    type: string
                  tanggal_pinjam:
                    type: string
                    format: date
                  tanggal_jatuh_tempo:
                    type: string
                    format: date
                  tanggal_kembali:
                    type: string
                    format: date
                    nullable: true
                  status:
                    type: string
                    enum: [dipinjam, dikembalikan]

    PeminjamanResource:
      type: object
      properties:
        id:
          type: integer
          example: 1
        kode_pinjam:
          type: string
          example: "PINJ-3FYQHF"
        buku_id:
          type: integer
          example: 1
        buku:
          type: object
          properties:
            id:
              type: integer
            isbn:
              type: string
            judul:
              type: string
            penulis:
              type: string
        nim_peminjam:
          type: string
          example: "12S24001"
        nama_peminjam:
          type: string
          example: "Mahasiswa Uji Satu"
        tanggal_pinjam:
          type: string
          format: date
          example: "2026-11-03"
        tanggal_jatuh_tempo:
          type: string
          format: date
          example: "2026-11-10"
        tanggal_kembali:
          type: string
          format: date
          nullable: true
        status:
          type: string
          enum: [dipinjam, dikembalikan]
          example: "dipinjam"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        _links:
          type: object
          properties:
            self:
              type: object
            buku:
              type: object
            kembalikan_buku:
              type: object
              description: HANYA muncul jika status === 'dipinjam'

    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        per_page:
          type: integer
        to:
          type: integer
          nullable: true
        total:
          type: integer

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          example: "https://tools.ietf.org/html/rfc7231#section-6.5.4"
        title:
          type: string
          example: "Not Found"
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: "Resource yang diminta tidak ditemukan."
        instance:
          type: string
          example: "/api/v1/bukus/999"
        errors:
          type: object
          description: Daftar detail kesalahan validasi (hadir pada error 422)
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Problem400:
      description: Bad Request (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Problem401:
      description: Unauthorized (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Problem404:
      description: Not Found (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Problem409:
      description: Conflict (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Problem422:
      description: Unprocessable Content / Validasi Gagal (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

    Problem502:
      description: Bad Gateway / Layanan Eksternal Bermasalah (RFC 7807)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
